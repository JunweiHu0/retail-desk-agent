entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: proxy
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: retail-eval-resume
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=8
    - gres=gpu:2
    - time=01:00:00
    - dependency=singleton
    - nodelist=10-0-4-11
    - output=${TACC_SLURM_USERLOG}/retail-eval-resume-%j.log
