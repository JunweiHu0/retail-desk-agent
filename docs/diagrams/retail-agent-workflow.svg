<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1710" viewBox="0 0 1400 1710"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7e9585"/></marker></defs><rect width="1400" height="1710" fill="#fff"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="40" y="49" font-size="29" font-weight="700" fill="#213e2c">Retail Desk · 已登录 Web Agent 工作流</text><text x="40" y="79" font-size="16" fill="#738379">动态工具循环 + 后端确定性校验 + 用户确认提交 ｜16 个官方接口，已登录模型暴露 14 个</text><rect x="40" y="110" width="220" height="105" rx="14" fill="#edf5ef" stroke="#b6d3bf" stroke-width="1.5"/><text x="150" y="145" text-anchor="middle" fill="#205139" font-weight="700" font-size="20">用户 / Vue</text><text x="150" y="176" text-anchor="middle" fill="#5a6c60" font-size="16">输入零售服务请求</text><rect x="310" y="110" width="230" height="105" rx="14" fill="#edf5ef" stroke="#b6d3bf" stroke-width="1.5"/><text x="425" y="145" text-anchor="middle" fill="#205139" font-weight="700" font-size="20">FastAPI 登录态</text><text x="425" y="176" text-anchor="middle" fill="#5a6c60" font-size="16">绑定可信 customer ID</text><rect x="590" y="110" width="280" height="105" rx="14" fill="#edf5ef" stroke="#b6d3bf" stroke-width="1.5"/><text x="730" y="145" text-anchor="middle" fill="#205139" font-weight="700" font-size="20">会话上下文</text><text x="730" y="176" text-anchor="middle" fill="#5a6c60" font-size="16">历史消息 + policy + 规则</text><rect x="920" y="110" width="400" height="105" rx="14" fill="#eef4fb" stroke="#b6cde8" stroke-width="1.5"/><text x="1120" y="145" text-anchor="middle" fill="#254c76" font-weight="700" font-size="20">Deep Agents / DeepSeek</text><text x="1120" y="176" text-anchor="middle" fill="#5a6c60" font-size="16">自主选择下一步工具与参数</text><path d="M260 162H310" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><path d="M540 162H590" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><path d="M870 162H920" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><rect x="900" y="275" width="420" height="105" rx="14" fill="#eef4fb" stroke="#b6cde8" stroke-width="1.5"/><text x="1110" y="310" text-anchor="middle" fill="#254c76" font-weight="700" font-size="20">模型输出</text><text x="1110" y="341" text-anchor="middle" fill="#5a6c60" font-size="16">回答 / 追问，或一个 tool_call</text><path d="M1120 215V275" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="275" width="290" height="105" rx="14" fill="#f4f5f4" stroke="#ccd2cd" stroke-width="1.5"/><text x="185" y="310" text-anchor="middle" fill="#4c6053" font-weight="700" font-size="20">回答用户 / 补充信息</text><text x="185" y="341" text-anchor="middle" fill="#5a6c60" font-size="16">无需业务工具时结束本轮</text><rect x="420" y="275" width="390" height="105" rx="14" fill="#edf5ef" stroke="#b6d3bf" stroke-width="1.5"/><text x="615" y="310" text-anchor="middle" fill="#205139" font-weight="700" font-size="20">RetailService.call</text><text x="615" y="341" text-anchor="middle" fill="#5a6c60" font-size="16">接收工具名称与结构化参数</text><path d="M900 315H810" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><text x="855" y="301" fill="#66796c" font-size="15" text-anchor="middle">tool_call</text><path d="M900 365H850V402H185V380" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="420" fill="#66796c" font-size="15" text-anchor="middle">直接回复</text><rect x="40" y="450" width="1280" height="85" rx="14" fill="#edf5ef" stroke="#b6d3bf" stroke-width="1.5"/><text x="680" y="485" text-anchor="middle" fill="#205139" font-weight="700" font-size="20">后端校验：参数 schema · 当前身份 · 订单归属 · 会话状态</text><text x="680" y="516" text-anchor="middle" fill="#5a6c60" font-size="16">校验失败 → 返回工具错误给模型，由模型纠正参数或向用户澄清</text><path d="M615 380V450" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="590" width="350" height="135" rx="14" fill="#eef4fb" stroke="#b6cde8" stroke-width="1.5"/><text x="215" y="625" text-anchor="middle" fill="#254c76" font-weight="700" font-size="20">读取 / 计算</text><text x="215" y="656" text-anchor="middle" fill="#5a6c60" font-size="16">5 个业务查询 + calculate</text><text x="215" y="683" text-anchor="middle" fill="#5a6c60" font-size="16">只读结果返回；计算器为安全替换</text><rect x="455" y="590" width="440" height="135" rx="14" fill="#fff4e7" stroke="#e6c79f" stroke-width="1.5"/><text x="675" y="625" text-anchor="middle" fill="#825724" font-weight="700" font-size="20">7 类业务写操作</text><text x="675" y="656" text-anchor="middle" fill="#5a6c60" font-size="16">官方工具先在内存副本运行</text><text x="675" y="683" text-anchor="middle" fill="#5a6c60" font-size="16">此时业务数据库尚未改变</text><rect x="970" y="590" width="350" height="135" rx="14" fill="#f4f5f4" stroke="#ccd2cd" stroke-width="1.5"/><text x="1145" y="625" text-anchor="middle" fill="#4c6053" font-weight="700" font-size="20">转人工工具</text><text x="1145" y="656" text-anchor="middle" fill="#5a6c60" font-size="16">transfer_to_human_agents</text><text x="1145" y="683" text-anchor="middle" fill="#5a6c60" font-size="16">记录本地转接，停止自动处理</text><path d="M680 535V560H215V590" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><path d="M680 535V590" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><path d="M680 560H1145V590" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="785" width="350" height="125" rx="14" fill="#eef4fb" stroke="#b6cde8" stroke-width="1.5"/><text x="215" y="820" text-anchor="middle" fill="#254c76" font-weight="700" font-size="20">↻ 回到 DeepSeek</text><text x="215" y="851" text-anchor="middle" fill="#5a6c60" font-size="16">真实工具结果 + _computed 事实</text><text x="215" y="878" text-anchor="middle" fill="#5a6c60" font-size="16">继续选择工具，或生成最终答复</text><path d="M215 725V785" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><rect x="970" y="785" width="350" height="125" rx="14" fill="#f4f5f4" stroke="#ccd2cd" stroke-width="1.5"/><text x="1145" y="820" text-anchor="middle" fill="#4c6053" font-weight="700" font-size="20">本轮结束</text><text x="1145" y="851" text-anchor="middle" fill="#5a6c60" font-size="16">尚未接入真人客服平台</text><text x="1145" y="878" text-anchor="middle" fill="#5a6c60" font-size="16">并非真的有人工坐席接通</text><path d="M1145 725V785" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><rect x="455" y="785" width="440" height="125" rx="14" fill="#fff4e7" stroke="#e6c79f" stroke-width="1.5"/><text x="675" y="820" text-anchor="middle" fill="#825724" font-weight="700" font-size="20">生成并保存 pending 预览</text><text x="675" y="851" text-anchor="middle" fill="#5a6c60" font-size="16">action_id + 参数 + 前后快照</text><text x="675" y="878" text-anchor="middle" fill="#5a6c60" font-size="16">保存 fingerprint，强制停止工具循环</text><path d="M675 725V785" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><rect x="455" y="970" width="440" height="125" rx="14" fill="#fff4e7" stroke="#e6c79f" stroke-width="1.5"/><text x="675" y="1005" text-anchor="middle" fill="#825724" font-weight="700" font-size="20">Vue 显示变更确认卡片</text><text x="675" y="1036" text-anchor="middle" fill="#5a6c60" font-size="16">用户核对后点击确认 / 取消</text><text x="675" y="1063" text-anchor="middle" fill="#5a6c60" font-size="16">聊天中的“是”不能提交业务变更</text><path d="M675 910V970" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="1150" width="350" height="125" rx="14" fill="#f4f5f4" stroke="#ccd2cd" stroke-width="1.5"/><text x="215" y="1185" text-anchor="middle" fill="#4c6053" font-weight="700" font-size="20">用户取消</text><text x="215" y="1216" text-anchor="middle" fill="#5a6c60" font-size="16">清除 pending，记录取消事件</text><text x="215" y="1243" text-anchor="middle" fill="#5a6c60" font-size="16">零售业务数据保持原样</text><path d="M455 1030H215V1150" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="1015" fill="#66796c" font-size="15" text-anchor="middle">取消</text><rect x="455" y="1150" width="440" height="125" rx="14" fill="#edf5ef" stroke="#b6d3bf" stroke-width="1.5"/><text x="675" y="1185" text-anchor="middle" fill="#205139" font-weight="700" font-size="20">后端处理确认（不由模型批准）</text><text x="675" y="1216" text-anchor="middle" fill="#5a6c60" font-size="16">校验 action_id、身份和 snapshot</text><text x="675" y="1243" text-anchor="middle" fill="#5a6c60" font-size="16">在 SQLite 事务内复核业务规则</text><path d="M675 1095V1150" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><text x="713" y="1128" fill="#66796c" font-size="15" text-anchor="middle">确认</text><rect x="970" y="1150" width="350" height="125" rx="14" fill="#f4f5f4" stroke="#ccd2cd" stroke-width="1.5"/><text x="1145" y="1185" text-anchor="middle" fill="#4c6053" font-weight="700" font-size="20">数据过期 / 重复 / 冲突</text><text x="1145" y="1216" text-anchor="middle" fill="#5a6c60" font-size="16">拒绝执行，不提交新的业务变更</text><text x="1145" y="1243" text-anchor="middle" fill="#5a6c60" font-size="16">过期提案需取消后重新生成</text><path d="M895 1210H970" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><text x="933" y="1195" fill="#66796c" font-size="15" text-anchor="middle">校验失败</text><rect x="455" y="1340" width="440" height="135" rx="14" fill="#edf5ef" stroke="#b6d3bf" stroke-width="1.5"/><text x="675" y="1375" text-anchor="middle" fill="#205139" font-weight="700" font-size="20">执行官方工具并持久化</text><text x="675" y="1406" text-anchor="middle" fill="#5a6c60" font-size="16">业务数据 + 不可变操作审计</text><text x="675" y="1433" text-anchor="middle" fill="#5a6c60" font-size="16">清空 pending + 返回真实执行回执</text><path d="M675 1275V1340" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><text x="725" y="1316" fill="#66796c" font-size="15" text-anchor="middle">校验通过</text><rect x="455" y="1535" width="440" height="105" rx="14" fill="#edf5ef" stroke="#b6d3bf" stroke-width="1.5"/><text x="675" y="1570" text-anchor="middle" fill="#205139" font-weight="700" font-size="20">前端同步 / 继续后续对话</text><text x="675" y="1601" text-anchor="middle" fill="#5a6c60" font-size="16">资料和订单更新，回执写入会话记忆</text><path d="M675 1475V1535" fill="none" stroke="#7e9585" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="1686" font-size="15" fill="#7b887e">来源：backend/agent.py · backend/retail.py · backend/main.py ｜代码核对日期：2026-10-28</text></g></svg>