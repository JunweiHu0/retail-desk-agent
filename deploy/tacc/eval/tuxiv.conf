entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: proxy
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: retail-eval
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=8
    - time=01:00:00
    - output=${TACC_SLURM_USERLOG}/retail-eval-%j.log
