entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: proxy
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: retail-serve
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=8
    - gres=gpu:2
    # up.sh fills this in from deploy/tacc/env (or drops the line when empty).
    - exclude=__EXCLUDE__
    - time=01:00:00
    - output=${TACC_SLURM_USERLOG}/retail-serve-%j.log
