entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: proxy
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: retail-setup
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=2
    # up.sh fills this in from deploy/tacc/env (or drops the line when empty).
    - exclude=__EXCLUDE__
    - time=00:30:00
    - output=${TACC_SLURM_USERLOG}/retail-setup-%j.log
