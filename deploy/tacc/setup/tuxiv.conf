entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: retail-setup
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=2
    - time=00:30:00
    - output=${TACC_SLURM_USERLOG}/retail-setup-%j.log
