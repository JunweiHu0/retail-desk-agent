entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: proxy
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: retail-bench
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=2
    - time=01:00:00
    - output=${TACC_SLURM_USERLOG}/retail-bench-%j.log
