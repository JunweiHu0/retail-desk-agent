<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retail agent · infra</title>
<link rel="icon" href="data:,">
<style>
:root { --bg:#f6f6f3; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#dcdcd6; --chip:#ecece6; --acc:#2f6db5;
  --ok:#2e8b57; --bad:#c0392b; --warn:#b7791f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#131312; --card:#1c1c1a; --ink:#ecece8;
  --muted:#9a9a94; --line:#34342f; --chip:#2a2a27; --acc:#7fb0ec; --ok:#6fcf97; --bad:#ff8a80; --warn:#f2c94c; } }
:root[data-theme="dark"] { --bg:#131312; --card:#1c1c1a; --ink:#ecece8; --muted:#9a9a94; --line:#34342f;
  --chip:#2a2a27; --acc:#7fb0ec; --ok:#6fcf97; --bad:#ff8a80; --warn:#f2c94c; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
header, main { max-width:1500px; margin:0 auto; padding:12px 16px; }
h1 { font-size:21px; margin:0 0 4px; }
h2 { font-size:15px; margin:18px 0 8px; }
.sub { color:var(--muted); font-size:13px; max-width:1000px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin:12px 0; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
.tile { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
.tile .k { color:var(--muted); font-size:12px; }
.tile .v { font:600 20px/1.2 ui-monospace,monospace; font-variant-numeric:tabular-nums; }
.tile .v small { font-size:12px; color:var(--muted); font-weight:400; }
.tblwrap { overflow-x:auto; }
table { border-collapse:collapse; font-variant-numeric:tabular-nums; width:100%; }
th, td { border-bottom:1px solid var(--line); padding:4px 8px; text-align:right; white-space:nowrap; }
th:first-child, td:first-child { text-align:left; }
th { color:var(--muted); font-weight:600; font-size:12px; }
tr.click { cursor:pointer; } tr.click:hover td { background:var(--chip); }
tr.on td { background:var(--chip); font-weight:600; }
.chip { background:var(--chip); border-radius:999px; padding:1px 9px; font-size:12px; }
.chip.bad { background:color-mix(in srgb, var(--bad) 22%, transparent); }
.chip.ok { background:color-mix(in srgb, var(--ok) 20%, transparent); }
.mono { font-family:ui-monospace,monospace; }
.detail { margin:8px 0 0 0; }
.detail th, .detail td { font-size:12px; padding:3px 8px; }
.bar { height:6px; background:var(--acc); border-radius:3px; display:inline-block; vertical-align:middle; }
.empty { color:var(--muted); font-size:13px; padding:8px 0; }
.charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:10px; margin-top:10px; }
.chart { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
.chart .hd { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
.chart svg { width:100%; height:84px; display:block; }
.chart .grid { stroke:var(--line); stroke-width:1; stroke-dasharray:2 3; }
.chart .ln { fill:none; stroke:var(--acc); stroke-width:1.6; vector-effect:non-scaling-stroke; }
button { background:var(--chip); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:4px 8px;
  font:inherit; font-size:13px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Retail agent · infra</h1>
  <div class="sub">
    上半屏是 vLLM 引擎的实时快照（服务端直接读 <span class="mono">/metrics</span>，不经过浏览器）。
    下面是每次进程运行落盘的记录：一个 run = 一个目录，turn → model call → tool call 逐层展开。
  </div>
</header>

<main>
  <h2>Live engine <span class="chip" id="liveState">连接中…</span></h2>
  <div class="tiles" id="live"></div>
  <div class="charts" id="charts"></div>

  <h2>Runs <span class="chip" id="runCount">—</span></h2>
  <div class="card">
    <div class="tblwrap"><table id="runs">
      <thead><tr><th>run</th><th>model</th><th>turns</th><th>p50 wall</th><th>p95 wall</th>
        <th>model calls</th><th>prompt tok</th><th>gen tok</th><th>tools</th><th>errors</th></tr></thead>
      <tbody><tr><td colspan="10" class="empty">还没有记录</td></tr></tbody>
    </table></div>
  </div>

  <div id="detail"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (v, d = 0) => v == null ? "–" : Number(v).toFixed(d);
const ms = (v) => v == null ? "–" : (v >= 1000 ? (v / 1000).toFixed(2) + " s" : Math.round(v) + " ms");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let selected = null;

const TILES = [
  ["tpot_ms", "TPOT 每 token", (v) => v == null ? "–" : fmt(v, 1) + " <small>ms</small>"],
  ["gen_rate", "解码吞吐", (v) => v == null ? "–" : fmt(v, 1) + " <small>tok/s</small>"],
  ["ttft_ms", "TTFT 窗口均值", (v) => v == null ? "–" : fmt(v) + " <small>ms</small>"],
  ["running", "运行中", (v) => fmt(v)],
  ["waiting", "排队", (v) => fmt(v)],
  ["kv", "KV 占用", (v) => v == null ? "–" : (v * 100).toFixed(1) + "%"],
  ["cache_window", "前缀命中（窗口）", (v) => v == null ? "–" : (v * 100).toFixed(1) + "%"],
  ["finished", "完成请求（窗口）", (v) => fmt(v)],
];

function spark(history, key, unit, scale = 1) {
  const pts = history.filter(s => s[key] != null);
  if (pts.length < 2) return `<div class="empty">采样中…</div>`;
  const vals = pts.map(s => s[key] * scale);
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = hi - lo || 1;
  const W = 600, H = 84, pad = 4;
  const xy = (s, v) => [
    pad + (t1 > t0 ? (s.t - t0) / (t1 - t0) : 0) * (W - 2 * pad),
    H - pad - ((v * scale - lo) / span) * (H - 2 * pad),
  ];
  const line = pts.map(s => xy(s, s[key]).map(n => n.toFixed(1)).join(",")).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line class="grid" x1="0" y1="${H - pad}" x2="${W}" y2="${H - pad}"/>
    <line class="grid" x1="0" y1="${H / 2}" x2="${W}" y2="${H / 2}"/>
    <polyline class="ln" points="${line}"/>
  </svg>
  <div class="hd"><span>${(pts[pts.length - 1].t - t0).toFixed(0)} s 窗口</span>
    <span>min ${lo.toFixed(1)} · max ${hi.toFixed(1)} ${unit}</span></div>`;
}

async function live() {
  const box = $("live"), charts = $("charts");
  try {
    const r = await fetch("/api/infra/live");
    const d = await r.json();
    const state = $("liveState");
    if (!d.available) {
      state.textContent = "不可用";
      state.className = "chip bad";
      box.innerHTML = `<div class="empty">${esc(d.reason)}</div>`;
      charts.innerHTML = "";
      return;
    }
    state.textContent = `${d.model || "ok"} · ${d.interval_s}s`;
    state.className = "chip ok";
    box.innerHTML = TILES.map(([k, label, f]) =>
      `<div class="tile"><div class="k">${label}</div><div class="v">${f(d[k])}</div></div>`).join("");
    charts.innerHTML = `
      <div class="chart"><div class="hd"><b>TPOT</b><span>ms / 输出 token</span></div>
        ${spark(d.history, "tpot_ms", "ms")}</div>
      <div class="chart"><div class="hd"><b>解码吞吐</b><span>token / s</span></div>
        ${spark(d.history, "gen_rate", "tok/s")}</div>`;
  } catch (e) {
    $("liveState").textContent = "断开";
    $("liveState").className = "chip bad";
  }
}

async function loadRuns() {
  const r = await fetch("/api/infra/runs");
  const d = await r.json();
  const rows = d.runs || [];
  $("runCount").textContent = `${rows.length} runs · ${d.dir || ""}`;
  const body = document.querySelector("#runs tbody");
  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="10" class="empty">还没有记录。跑一轮对话后刷新。</td></tr>`;
    return;
  }
  body.innerHTML = rows.map(r => `
    <tr class="click ${r.run_id === selected ? "on" : ""}" data-run="${esc(r.run_id)}">
      <td class="mono">${esc(r.run_id)}</td>
      <td class="mono">${esc(r.model || "")}</td>
      <td>${fmt(r.turns)}</td>
      <td>${ms(r.p50_wall_ms)}</td>
      <td>${ms(r.p95_wall_ms)}</td>
      <td>${fmt(r.model_calls)}</td>
      <td>${fmt(r.prompt_tokens)}</td>
      <td>${fmt(r.completion_tokens)}</td>
      <td>${fmt(r.tool_calls)}</td>
      <td>${r.errors ? `<span class="chip bad">${r.errors}</span>` : "0"}</td>
    </tr>`).join("");
  body.querySelectorAll("tr.click").forEach(tr =>
    tr.onclick = () => { selected = tr.dataset.run; loadRuns(); loadDetail(selected); });
}

async function loadDetail(runId) {
  const host = $("detail");
  const r = await fetch(`/api/infra/runs/${encodeURIComponent(runId)}`);
  if (!r.ok) { host.innerHTML = ""; return; }
  const d = await r.json();
  const reqByTurn = {}, toolsByTurn = {};
  for (const q of d.requests) (reqByTurn[q.turn_id] ||= []).push(q);
  for (const t of d.tools) (toolsByTurn[t.turn_id] ||= []).push(t);
  const maxWall = Math.max(1, ...d.turns.map(t => t.wall_ms || 0));

  host.innerHTML = `
    <h2>Run <span class="mono">${esc(runId)}</span></h2>
    <div class="card">
      <div class="row sub">${esc(d.manifest.host || "")} · ${esc(d.manifest.mode)} · ${esc(d.manifest.model)}
        · ${esc(d.manifest.base_url || "")} ${d.manifest.slurm_job_id ? "· job " + esc(d.manifest.slurm_job_id) : ""}</div>
      <div class="tblwrap"><table>
        <thead><tr><th>turn</th><th>wall</th><th></th><th>model calls</th><th>prompt tok</th><th>gen tok</th>
          <th>tools</th><th>tool ms</th><th>answer</th></tr></thead>
        <tbody>${d.turns.map(t => {
          const w = (t.wall_ms || 0) / maxWall * 100;
          return `<tr class="click" data-turn="${esc(t.turn_id)}">
            <td class="mono">${esc(t.turn_id)}${t.error ? ` <span class="chip bad">${esc(t.error)}</span>` : ""}</td>
            <td>${ms(t.wall_ms)}</td>
            <td><span class="bar" style="width:${w}%"></span></td>
            <td>${fmt(t.model_calls)}</td><td>${fmt(t.prompt_tokens)}</td><td>${fmt(t.completion_tokens)}</td>
            <td>${fmt(t.tool_calls)}</td><td>${ms(t.tool_ms)}</td><td>${fmt(t.answer_chars)} ch</td></tr>
            <tr class="detail" data-detail="${esc(t.turn_id)}" style="display:none"><td colspan="9">
              <table><thead><tr><th>#</th><th>model call</th><th>prompt</th><th>gen</th><th>finish</th><th>tools</th></tr></thead>
              <tbody>${(reqByTurn[t.turn_id] || []).map(q => `<tr>
                <td>${q.seq}</td><td>${ms(q.wall_ms)}</td><td>${fmt(q.prompt_tokens)}</td>
                <td>${fmt(q.completion_tokens)}</td><td class="mono">${esc(q.finish_reason || "–")}</td>
                <td class="mono">${esc((q.tools || []).join(", ") || "–")}</td></tr>`).join("")}</tbody></table>
              ${(toolsByTurn[t.turn_id] || []).length ? `<div class="sub" style="margin-top:6px">工具：` +
                toolsByTurn[t.turn_id].map(x => `<span class="chip ${x.ok ? "ok" : "bad"}">${esc(x.name)} · ${ms(x.duration_ms)}</span>`).join(" ") + `</div>` : ""}
            </td></tr>`;
        }).join("")}</tbody>
      </table></div>
    </div>`;
  host.querySelectorAll("tr[data-turn]").forEach(tr =>
    tr.onclick = () => {
      const d2 = host.querySelector(`tr[data-detail="${tr.dataset.turn}"]`);
      d2.style.display = d2.style.display === "none" ? "" : "none";
    });
}

live(); loadRuns();
setInterval(live, 2000);
setInterval(loadRuns, 5000);
</script>
</body>
</html>
